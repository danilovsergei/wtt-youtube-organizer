name: Supabase Cloud Sync Keep-Alive

on:
  schedule:
    # Runs daily at 12:00 UTC (4:00 AM PST)
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  keepalive:
    name: Ping Registered Supabase Projects
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install psycopg2-binary

      - name: Run Keep-Alive Worker
        env:
          DATABASE_URL: ${{ secrets.CENTRAL_DATABASE_URL }}
        run: python3 tools/keepalive/ping_endpoints.py
